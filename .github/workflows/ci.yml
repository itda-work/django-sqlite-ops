name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    name: test (py${{ matrix.python }}, django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
        django: ["5.2", "6.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e . "django~=${{ matrix.django }}.0" --group dev
      - name: Test
        run: uv run --no-sync pytest -v

  # 지원 하한(DESIGN §5: SQLite 3.37)을 실제로 돈다. uv 가 받는 Python 은 최신 SQLite 를
  # 정적으로 품고 있어서 위 매트릭스로는 하한이 검사되지 않는다. Ubuntu 22.04 의 시스템
  # libsqlite3(3.37.2)에 연결된 deadsnakes Python 을 쓴다.
  sqlite-floor:
    name: test (sqlite 3.37, py3.13, django 5.2)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      EXPECT_SQLITE: "3.37"
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.13 (system SQLite)
        run: |
          apt-get update -qq
          apt-get install -y -qq software-properties-common
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get install -y -qq python3.13 python3.13-venv
      - name: Install
        run: |
          python3.13 -m venv .venv
          .venv/bin/pip install -q -e . "django~=5.2.0" pytest
      - name: Test
        run: .venv/bin/pytest -v

  # 실제 litestream 바이너리로 boot/litestream 통합 테스트를 돈다. 다른 잡에는 바이너리가
  # 없어 skip 되므로, 여기서는 REQUIRE_LITESTREAM=1 로 바이너리가 없어 skip 되는 경우를 실패로 바꾼다.
  # 설치는 공식 방법(https://litestream.io/install/linux/)인 릴리스 .deb + dpkg 다. apt 는 쓰지 않는다.
  # .deb 는 같은 릴리스의 checksums.txt 와 SHA-256 이 맞아야 설치한다.
  litestream:
    name: test (litestream 0.5.17, py3.14, django 6.1)
    runs-on: ubuntu-latest
    env:
      LITESTREAM_VERSION: "0.5.17"  # 바꾸면 위 name 도 함께 고친다
      REQUIRE_LITESTREAM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install litestream
        run: |
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          deb="litestream-${LITESTREAM_VERSION}-linux-${arch}.deb"
          base="https://github.com/benbjohnson/litestream/releases/download/v${LITESTREAM_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o checksums.txt "$base/checksums.txt"
          curl -fsSL --retry 3 -o "$deb" "$base/$deb"
          # 같은 릴리스의 checksums.txt 로 SHA-256 을 맞춘 뒤에만 설치한다. 항목이 없거나 다르면 실패.
          want="$(awk -v f="$deb" '$2 == f { print $1 }' checksums.txt)"
          if [ -z "$want" ]; then
            echo "no checksum entry for $deb in checksums.txt" >&2
            exit 1
          fi
          echo "$want  $deb" | sha256sum -c -
          sudo dpkg -i "$deb"
          got="$(litestream version)"
          if [ "$got" != "$LITESTREAM_VERSION" ]; then
            echo "litestream version mismatch: got '$got', want '$LITESTREAM_VERSION'" >&2
            exit 1
          fi
      - name: Install
        run: |
          uv venv --python 3.14
          uv pip install -e . "django~=6.1.0" --group dev
      - name: Test
        run: uv run --no-sync pytest -v -rs
