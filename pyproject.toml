[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-sqlite-ops"
version = "0.0.0"
description = "Operations toolkit for running SQLite as a production database in Django"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["Django>=5.2"]

[project.optional-dependencies]
nats = ["channels-nats"]
channels-lite = ["channels-lite"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
# 스파이크 코드는 참고용이라 고치지 않는다 (docs/reference/README.md)
extend-exclude = ["docs/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
